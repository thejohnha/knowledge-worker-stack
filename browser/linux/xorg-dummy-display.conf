# A fake 1680x1050 monitor for Xorg's dummy driver: Chrome draws here, no screen hardware needed.
# To change the size, edit the Modeline AND the Virtual line together, then restart the stack.
Section "Device"
  Identifier "dummy"
  Driver "dummy"
  VideoRam 256000
EndSection
Section "Monitor"
  Identifier "dummy-mon"
  HorizSync 5.0-1000.0
  VertRefresh 5.0-200.0
  Modeline "1680x1050" 146.25 1680 1784 1960 2240 1050 1053 1059 1089 -hsync +vsync
EndSection
Section "Screen"
  Identifier "dummy-scr"
  Device "dummy"
  Monitor "dummy-mon"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1680x1050"
    Virtual 1680 1050
  EndSubSection
EndSection
