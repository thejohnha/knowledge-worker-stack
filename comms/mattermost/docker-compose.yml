# Mattermost Team Edition + PostgreSQL on this Mac, reachable only from this Mac (README.md beside this file).
# Data lives in named volumes, so it survives `docker compose down`; only `down -v` deletes it.
# POSTGRES_PASSWORD comes from the .env file beside this one.
name: mattermost

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mattermost
    volumes:
      - db:/var/lib/postgresql          # PostgreSQL 18 keeps its data one level down, in 18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 12

  mattermost:
    image: mattermost/mattermost-team-edition:11.7.14
    platform: linux/amd64               # published for amd64 only; OrbStack runs it through Rosetta
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8065:8065"           # this Mac only; see "Reach it from your phone" in README.md
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${POSTGRES_PASSWORD}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MM_SITEURL:-http://localhost:8065}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"            # lets `mmctl --local` inside the container manage it, no login
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "false"    # a webhook post would look like yours to the phone bridge
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"             # no sign-up without an invite; the first account still can
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"             # no usage statistics sent to Mattermost
    volumes:
      - config:/mattermost/config
      - data:/mattermost/data
      - logs:/mattermost/logs
      - plugins:/mattermost/plugins
      - client-plugins:/mattermost/client/plugins

volumes:
  db:
  config:
  data:
  logs:
  plugins:
  client-plugins:
